<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berufsschule</title>
<style>
:root{--bg:#f7f7f5;--fg:#1d1d1f;--mut:#76767c;--card:#fff;--bd:#e3e3e0;--ac:#3b6ef5}
[data-theme=dark]{--bg:#121214;--fg:#ececee;--mut:#9b9ba3;--card:#1b1b1e;--bd:#2c2c31}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121214;--fg:#ececee;--mut:#9b9ba3;--card:#1b1b1e;--bd:#2c2c31}}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
#app{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:8px;margin-bottom:14px}.sp{flex:1}
button,.btn{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-block}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}.chip{white-space:nowrap;border-radius:20px}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
small,.mut{color:var(--mut)}h2,h3{margin:16px 0 6px;font-weight:600}
input,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%;margin:4px 0}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:12px}
#modal>div{background:var(--bg);border-radius:12px;padding:16px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
table{width:100%;border-collapse:collapse}td{padding:6px 4px;border-bottom:1px solid var(--bd);vertical-align:top}
#sum{padding:8px;border:1px dashed var(--bd);border-radius:8px;white-space:pre-wrap}img{max-width:100%;border-radius:8px;margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
</style></head><body>
<div id="app"></div><div id="modal"><div id="mb"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,addDoc,deleteDoc,updateDoc,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
// ВСТАВ СВОЇ ДАНІ З FIREBASE (firebaseConfig):
const CFG={apiKey:"AIzaSyCjRN3-1twmxhYOzOVOsGMJrsjbm7K8ELA",authDomain:"vovava.firebaseapp.com",projectId:"vovava",appId:"1:434009268149:web:310c3d9a4c570cdb4303fc"};
const SYS=`You are a study assistant for a German Berufsschule (electrician apprentice). The input is a German school worksheet (text and/or page photos). Reply with JSON only: {"s":"short Ukrainian explanation of what the material is about, 3-6 sentences","d":[["German key term","Ukrainian definition"]],"w":[["German word, nouns with article der/die/das","Ukrainian translation"]]}. d: up to 10 key definitions from the material. w: up to 25 main topic words plus any difficult words; skip trivial words. Keep German terms in German. Never invent facts that are not in the material.`;
const DEF=["Elektrotechnik","Fachkunde Elektro","Mathematik","Physik","Deutsch","Arbeitsschutz","Wirtschaft und Sozialkunde","Werkstatt/Praxis"];
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S={u:null,set:{},subs:[],mats:[],cur:null,mat:null};let db,auth;
if(CFG.apiKey==="PASTE"){$("#app").innerHTML="<h2>Потрібне налаштування</h2><p>Встав дані firebaseConfig на початку скрипта в index.html.</p>"}
else{const a=initializeApp(CFG);auth=getAuth(a);db=getFirestore(a);onAuthStateChanged(auth,async u=>{S.u=u;if(u)await load();render()})}
const col=n=>collection(db,"users",S.u.uid,n),dr=(n,i)=>doc(db,"users",S.u.uid,n,i);
async function load(){
 const s=await getDoc(doc(db,"users",S.u.uid));S.set=s.exists()?s.data():{};theme();
 let q=await getDocs(col("subjects"));
 if(q.empty){await Promise.all(DEF.map((n,i)=>addDoc(col("subjects"),{name:n,o:i})));q=await getDocs(col("subjects"))}
 S.subs=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.o-b.o);S.cur=S.cur||S.subs[0]?.id;
 S.mats=(await getDocs(col("materials"))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.t-a.t)}
function theme(){const r=document.documentElement;r.dataset.theme=S.set.theme&&S.set.theme!=="auto"?S.set.theme:"";r.style.setProperty("--ac",S.set.acc||"#3b6ef5")}
function render(){
 const m=$("#app");
 if(!S.u){m.innerHTML=`<h2>Berufsschule</h2><p class=mut>Твої матеріали з уроків в одному місці.</p><button class=p data-a=login>Увійти через Google</button>`;return}
 const h=`<header><b>Berufsschule</b><span class=sp></span><button data-a=set>Налаштування</button></header>`;
 m.innerHTML=h+(S.mat?matView():listView())}
function listView(){
 const chips=S.subs.map(s=>`<button class="chip${s.id==S.cur?" on":""}" data-a=sub data-v="${s.id}">${esc(s.name)}</button>`).join("")+`<button class=chip data-a=addsub>+</button>`;
 const g={};S.mats.filter(x=>x.sub==S.cur).forEach(x=>(g[x.topic||"Без теми"]??=[]).push(x));
 const b=Object.entries(g).map(([t,a])=>`<h3>${esc(t)}</h3>`+a.map(x=>`<div class=card data-a=open data-v="${x.id}"><span>${esc(x.title)}</span><small>${new Date(x.t).toLocaleDateString("uk")}</small></div>`).join("")).join("")||`<p class=mut>Тут поки порожньо. Додай перший матеріал.</p>`;
 return`<div class=chips>${chips}</div><div class=row><button class=p data-a=new>Додати матеріал</button><button data-a=rensub>Перейменувати предмет</button><button data-a=delsub>Видалити предмет</button></div>${b}`}
function matView(){const m=S.mat;
 return`<button data-a=back>Назад</button><h2>${esc(m.title)}</h2><small>${esc(S.subs.find(s=>s.id==m.sub)?.name||"")} · ${esc(m.topic||"Без теми")}</small>
 <h3>Про що йдеться</h3><div id=sum contenteditable>${esc(m.sum)}</div><div class=row><button data-a=savesum>Зберегти текст</button></div>
 <h3>Визначення</h3>${(m.defs||[]).map(d=>`<p><b>${esc(d.a)}</b> — ${esc(d.b)}</p>`).join("")||"<p class=mut>Немає</p>"}
 <h3>Слова</h3><table>${(m.words||[]).map(w=>`<tr><td><b>${esc(w.de)}</b></td><td>${esc(w.uk)}</td></tr>`).join("")}</table>
 ${m.imgs?`<h3>Сторінки</h3>${m.imgs.map(i=>`<img src="${i}">`).join("")}`:""}
 <div class=row><button data-a=delmat>Видалити матеріал</button></div>`}
const modal=h=>{$("#mb").innerHTML=h;$("#modal").style.display="flex"},close=()=>$("#modal").style.display="none";
$("#modal").onclick=e=>{if(e.target.id==="modal")close()};
const act={
 login:()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>alert("Не вдалося увійти: "+e.code)),
 sub:id=>{S.cur=id;render()},back:()=>{S.mat=null;render()},
 async addsub(){const n=prompt("Назва предмета");if(!n)return;await addDoc(col("subjects"),{name:n,o:S.subs.length});await load();render()},
 async rensub(){const s=S.subs.find(x=>x.id==S.cur),n=prompt("Нова назва",s?.name);if(!n)return;await updateDoc(dr("subjects",S.cur),{name:n});await load();render()},
 async delsub(){if(S.mats.some(x=>x.sub==S.cur))return alert("Спочатку видали матеріали цього предмета.");if(!confirm("Видалити предмет?"))return;await deleteDoc(dr("subjects",S.cur));S.cur=null;await load();render()},
 new(){const tl=[...new Set(S.mats.filter(x=>x.sub==S.cur).map(x=>x.topic).filter(Boolean))].map(t=>`<option value="${esc(t)}">`).join("");
  modal(`<h3>Новий матеріал</h3><input id=ti placeholder="Назва (необов'язково)"><input id=tp list=tl placeholder="Тема, наприклад: Закон Ома"><datalist id=tl>${tl}</datalist>
  <div class=row><label class=btn>Файли<input id=fl type=file multiple accept="image/*,.pdf,.docx,.pptx,.txt" hidden></label><label class=btn>Камера<input id=cam type=file accept="image/*" capture=environment hidden></label></div>
  <div id=fn class=mut>Файли не обрано</div><div id=st class=mut></div><div class=row><button class=p data-a=go>Створити конспект</button><button data-a=close>Скасувати</button></div>`);
  $("#mb").onchange=()=>{$("#fn").textContent=[...$("#fl").files,...$("#cam").files].map(f=>f.name).join(", ")||"Файли не обрано"}},
 close,
 async go(){
  const files=[...$("#fl").files,...$("#cam").files],st=t=>$("#st").textContent=t;
  if(!files.length)return st("Обери файл або зроби фото.");
  if(!S.set.key)return st("Спочатку додай API-ключ у налаштуваннях.");
  try{st("Читаю файли…");const{txt,imgs}=await read(files);
   const parts=[];if(txt.trim())parts.push({text:"Material text:\n"+txt.slice(0,24000)});
   imgs.forEach(d=>parts.push({inlineData:{mimeType:"image/jpeg",data:d.split(",")[1]}}));
   st("Генерую конспект…");const r=await ask(parts);
   const pr=x=>(x||[]).filter(Array.isArray).map(y=>[String(y[0]),String(y[1])]);
   const d=pr(r.d).map(([a,b])=>({a,b})),w=pr(r.w).map(([de,uk])=>({de,uk}));
   const keep=imgs.reduce((n,i)=>n+i.length,0)<900000&&imgs.length>0,t=Date.now();
   const ref=await addDoc(col("materials"),{sub:S.cur,topic:$("#tp").value.trim(),title:$("#ti").value.trim()||files[0].name.replace(/\.\w+$/,""),sum:String(r.s||""),defs:d,words:w,t,pg:keep});
   if(keep)await setDoc(dr("pages",ref.id),{imgs});
   await Promise.all(w.map(x=>setDoc(dr("words",x.de.toLowerCase().replace(/[\/\s.#?\[\]]+/g,"_").slice(0,100)||"x"),{de:x.de,uk:x.uk,sub:S.cur,mat:ref.id,t},{merge:true})));
   await load();close();act.open(ref.id)}
  catch(e){st("Помилка: "+(e.status?"Gemini "+e.status+(e.status==429?" (ліміт запитів, спробуй пізніше)":""):e.message))}},
 async open(id){const m=S.mats.find(x=>x.id==id);S.mat={...m};if(m.pg){const p=await getDoc(dr("pages",id));S.mat.imgs=p.data()?.imgs}render();scrollTo(0,0)},
 async savesum(){await updateDoc(dr("materials",S.mat.id),{sum:$("#sum").innerText});S.mat.sum=$("#sum").innerText;await load();alert("Збережено")},
 async delmat(){if(!confirm("Видалити матеріал?"))return;await deleteDoc(dr("materials",S.mat.id));await deleteDoc(dr("pages",S.mat.id));S.mat=null;await load();render()},
 set(){const s=S.set;modal(`<h3>Налаштування</h3><small>API-ключ Gemini</small><input id=k type=password value="${esc(s.key)}" placeholder="Ключ з aistudio.google.com">
  <small>Модель (ID з AI Studio)</small><input id=m value="${esc(s.model||"gemini-flash-latest")}"><small>Запасна модель</small><input id=f value="${esc(s.fb||"gemini-flash-lite-latest")}">
  <small>Тема</small><select id=th>${[["auto","Авто"],["light","Світла"],["dark","Темна"]].map(([v,n])=>`<option value=${v}${(s.theme||"auto")==v?" selected":""}>${n}</option>`).join("")}</select>
  <small>Акцентний колір</small><input id=ac type=color value="${s.acc||"#3b6ef5"}">
  <div class=row><button class=p data-a=saveset>Зберегти</button><button data-a=out>Вийти</button><button data-a=close>Закрити</button></div>`)},
 async saveset(){S.set={...S.set,key:$("#k").value.trim(),model:$("#m").value.trim(),fb:$("#f").value.trim(),theme:$("#th").value,acc:$("#ac").value};await setDoc(doc(db,"users",S.u.uid),S.set,{merge:true});theme();close()},
 async out(){close();await signOut(auth);S.mat=null}};
$("body").onclick=e=>{const a=e.target.closest("[data-a]");if(a)act[a.dataset.a]?.(a.dataset.v)};
async function ask(parts){const ms=[S.set.model||"gemini-flash-latest"];if(S.set.fb&&S.set.fb!==ms[0])ms.push(S.set.fb);let err;
 for(const m of ms){try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":S.set.key},body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents:[{parts}],generationConfig:{responseMimeType:"application/json",temperature:.2}})});
  if(!r.ok){err=new Error();err.status=r.status;if([404,429,503].includes(r.status))continue;throw err}
  const j=await r.json();return JSON.parse(j.candidates[0].content.parts.map(p=>p.text||"").join("").replace(/```json|```/g,""))}catch(e){err=e;if(!e.status)throw e}}
 throw err}
async function shrink(src,max=1280){const b=src instanceof Blob?await createImageBitmap(src):src,k=Math.min(1,max/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=b.width*k;c.height=b.height*k;c.getContext("2d").drawImage(b,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.65)}
async function read(files){let txt="";const imgs=[];
 for(const f of files){const n=f.name.toLowerCase();
  if(f.type.startsWith("image/"))imgs.push(await shrink(f));
  else if(n.endsWith(".txt"))txt+=await f.text()+"\n";
  else if(n.endsWith(".docx"))txt+=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value+"\n";
  else if(n.endsWith(".pptx")){const z=await JSZip.loadAsync(await f.arrayBuffer());
   for(const k of Object.keys(z.files).filter(k=>/^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a,b)=>a.match(/\d+/)-b.match(/\d+/)))
    txt+=[...(await z.files[k].async("string")).matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m=>m[1]).join(" ")+"\n"}
  else if(n.endsWith(".pdf")){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
   const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t="";
   for(let i=1;i<=pdf.numPages;i++)t+=(await(await pdf.getPage(i)).getTextContent()).items.map(x=>x.str).join(" ")+"\n";
   if(t.replace(/\s/g,"").length<60*pdf.numPages){for(let i=1;i<=Math.min(pdf.numPages,6);i++){const p=await pdf.getPage(i),v=p.getViewport({scale:1.5}),c=document.createElement("canvas");c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext("2d"),viewport:v}).promise;imgs.push(await shrink(c))}}else txt+=t}}
 return{txt,imgs}}
</script></body></html>
