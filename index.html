<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berufsschule</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%233b6ef5'/%3E%3Cpolygon points='56,12 24,56 46,56 40,88 76,40 54,40' fill='white'/%3E%3C/svg%3E">
<style>
:root{--bg:#f7f7f5;--fg:#1d1d1f;--mut:#76767c;--card:#fff;--bd:#e3e3e0;--ac:#3b6ef5}
[data-theme=dark]{--bg:#121214;--fg:#ececee;--mut:#9b9ba3;--card:#1b1b1e;--bd:#2c2c31}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121214;--fg:#ececee;--mut:#9b9ba3;--card:#1b1b1e;--bd:#2c2c31}}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
#app{max-width:1200px;margin:0 auto;padding:20px 24px}
header{display:flex;align-items:center;gap:8px;margin-bottom:14px}.sp{flex:1}
button,.btn{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-block}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}

.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
small,.mut{color:var(--mut)}h2,h3{margin:16px 0 6px;font-weight:600}
input,select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%;margin:4px 0}
#modal{position:fixed;inset:0;z-index:30;background:#0007;display:none;align-items:center;justify-content:center;padding:12px}
#modal>div{background:var(--bg);border-radius:12px;padding:16px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
table{width:100%;border-collapse:collapse}td{padding:6px 4px;border-bottom:1px solid var(--bd);vertical-align:top}
#sum{padding:8px;border:1px dashed var(--bd);border-radius:8px;white-space:pre-wrap}img{max-width:100%;border-radius:8px;margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#rail{position:fixed;left:0;top:0;bottom:0;width:56px;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:10px 8px;overflow:hidden;transition:width .16s ease;z-index:5;white-space:nowrap}
body.in{padding-left:56px}
.ri{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:10px 11px;border-radius:8px}.ri.on{color:var(--ac)}.ri:last-child{margin-top:auto}
.ri svg{flex:none}.ri span{opacity:0;transition:opacity .12s}
.sl{display:none;flex-direction:column;margin:0 0 6px 40px;max-height:55vh;overflow:auto}
.si{text-align:left;border:0;background:none;padding:6px 10px;border-radius:6px;color:var(--mut)}.si.on{color:var(--ac);font-weight:600}.ri:hover,.si:hover{background:var(--bd)}
#rail.open{width:240px}#rail.open .ri span{opacity:1}#rail.open .sl.on{display:flex}
@media(hover:hover){#rail:hover{width:240px}#rail:hover .ri span{opacity:1}#rail:hover .sl.on{display:flex}}
#cm{position:fixed;display:none;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:4px;z-index:20;min-width:170px;box-shadow:0 6px 20px #0004}
#cm button{display:block;width:100%;border:0;text-align:left;background:none}#cm button:hover{background:var(--bd)}
.notes{columns:220px;column-gap:10px;margin-top:14px}.note{break-inside:avoid;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:0 0 10px;cursor:pointer;white-space:pre-wrap;word-break:break-word}.note b{display:block;margin-bottom:4px}
textarea{resize:vertical}.sw{width:28px;height:28px;border-radius:50%;padding:0;border:2px solid var(--bd)}.sw.on{border-color:var(--ac)}
.rd{max-width:820px}h3.sec{font-size:.78em;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:28px 0 10px;font-weight:600}
.mt{display:flex;flex-wrap:wrap;gap:6px}.pill{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:2px 11px;font-size:.84em;color:var(--mut)}
.sumb{border-left:4px solid var(--ac);background:var(--card);border-radius:0 12px 12px 0;padding:14px 18px;font-size:1.07em;line-height:1.75;margin:6px 0 8px}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.dc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 15px;line-height:1.5}.dc b{display:block;color:var(--ac);margin-bottom:2px}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}.wc{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;gap:10px}.wc span{color:var(--mut);text-align:right}
.fc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:8px 0}.fc code{display:block;font:600 1.18em ui-monospace,Consolas,monospace;color:var(--ac);margin-bottom:4px}
.st{border:0;background:none;font-size:1.25em;padding:0 4px;color:var(--ac)}
.pb{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0 4px}.pb i{display:block;height:100%;background:var(--ac);transition:width .3s}
.sh{display:block;margin-bottom:4px}.sp{white-space:pre-wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:20px;border-radius:14px;transition:border-color .15s,transform .15s}.tile:hover{border-color:var(--ac);transform:translateY(-2px)}.tile svg{color:var(--ac)}.tile small{color:var(--mut)}
.tk{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:10px 0}.tq{line-height:1.6;margin-bottom:8px}
.hh{border-left:3px solid var(--ac);padding:6px 12px;margin:8px 0;border-radius:0 8px 8px 0;background:var(--bg);line-height:1.6}.hh small{color:var(--ac);display:block}
.mtl summary{cursor:pointer;font-weight:600;padding:10px 14px;background:var(--card);border:1px solid var(--bd);border-radius:10px}.raw{white-space:pre-wrap;color:var(--mut);font-size:.9em;margin-top:10px}
</style></head><body>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,addDoc,deleteDoc,updateDoc,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import{CFG}from"./config.js";
const SYS=`You are a study assistant for a German Berufsschule (electrician apprentice). LANGUAGE RULE: the source is in German, but all explanatory text (s, the explanations in d, q and h) must be written in Ukrainian; never copy or paraphrase whole German sentences from the source; German may appear only as single terms or short term phrases, e.g. \"Оглядова схема (Übersichtsschaltplan)\". The input is a German school worksheet (text and/or page photos). The input is a numbered list of units (page images or file texts) that may belong to DIFFERENT topics. Group the units by topic into separate materials: units of one topic stay together even if not adjacent, and every unit belongs to exactly one material. Reply with JSON only: {"m":[{"u":[unit numbers],"j":"the subject from the Subjects list that matches the worksheet header field Fach (e.g. ST = Steuerungstechnik = Fachunterricht Steuerungstechnik (FU-ST)); empty string if unsure","th":"topic from the header field Thema, empty if absent","t":"short topic title in German, max 5 words","s":[{"h":"section heading in Ukrainian with the German term in brackets","p":"clear explanation in Ukrainian"}],"d":[["German key term (with article for nouns)","Ukrainian translation of the term","short Ukrainian explanation of what it means"]],"w":[["German word, nouns with article der/die/das","Ukrainian translation"]],"f":[{"f":"formula as plain text","n":"German name of the formula","v":[{"s":"symbol","de":"German meaning of the symbol (with unit if given)","uk":"Ukrainian translation"}]}],"k":[{"n":"task label as on the sheet","q":"what the task asks, in Ukrainian, 1-2 sentences","h":["hint 1","hint 2","hint 3"]}]}]}. Every item of "m" has this shape. k: every task the student must solve on the worksheet (max 12, [] if none). Hints in Ukrainian: 1 = which concept or part of the material to look at, no answer; 2 = a partial step or an example, not the full answer; 3 = the full short model answer. For diagram tasks rely only on what is clearly visible and say so if unsure. f: every formula found in the material, written as plain readable text with Unicode symbols (·, ×, /, ², ⁻¹⁹, Ω, π), never LaTeX or backslash commands (max 15, [] if none), explaining each symbol. s: a study text that teaches the content of the material to a learner who did not understand it: 3-8 sections in the order of the material, each 2-6 sentences, plain language, with the reasoning, examples and numbers from the material; keep German terms in German and explain them in Ukrainian; do not merely describe what the material is about. Write correct, natural Ukrainian with careful spelling and simple sentences. d: up to 10 key definitions from the material. w: up to 25 main topic words plus any difficult words; skip trivial words. Keep German terms in German. Never invent facts that are not in the material. If part of the material is unreadable or unclear, say so instead of guessing.`;
const DEF=["Deutsch (D)","Ethik (Eth)","Politik und Gesellschaft (PuG)","Installations- und Energietechnik (IE)","System- und Gerätetechnik (SG)","Fachunterricht Steuerungstechnik (FU-ST)","Fachunterricht IT-Systeme (FU-IT)","Fachunterricht (FU)"];
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago=t=>{const d=Math.round((new Date().setHours(0,0,0,0)-new Date(t).setHours(0,0,0,0))/864e5);return new Date(t).toLocaleDateString("uk")+" · "+(d<1?"сьогодні":d==1?"вчора":d+" дн. тому")};
const SUPm={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","-":"⁻","+":"⁺","n":"ⁿ"},SUBm={"0":"₀","1":"₁","2":"₂","3":"₃","4":"₄","5":"₅","6":"₆","7":"₇","8":"₈","9":"₉"},
MC={cdot:"·",times:"×",div:"÷",pm:"±",approx:"≈",leq:"≤",le:"≤",geq:"≥",ge:"≥",neq:"≠",ne:"≠",rightarrow:"→",to:"→",Rightarrow:"⇒",infty:"∞",circ:"°",sqrt:"√",left:"",right:"",alpha:"α",beta:"β",gamma:"γ",delta:"δ",Delta:"Δ",epsilon:"ε",varepsilon:"ε",eta:"η",theta:"θ",lambda:"λ",mu:"µ",pi:"π",rho:"ρ",sigma:"σ",Sigma:"Σ",tau:"τ",phi:"φ",varphi:"φ",Phi:"Φ",omega:"ω",Omega:"Ω"};
function mf(t){t=String(t??"");if(!/[\\^_{$]/.test(t))return t;
 const w=x=>/^[^\s+\-*\/=()·×]+$/.test(x)?x:"("+x+")";
 t=t.replace(/\$/g,"").replace(/\\(?:text|mathrm|mathbf|operatorname)\s*\{([^{}]*)\}/g,"$1")
  .replace(/\^\{([^{}]*)\}|\^([0-9+-]+|[a-z])/g,(_,a,b)=>{const x=a??b;return[...x].every(c=>SUPm[c])?[...x].map(c=>SUPm[c]).join(""):"^("+x+")"})
  .replace(/_\{([^{}]*)\}|_(\d+)/g,(_,a,b)=>{const x=a??b;return[...x].every(c=>SUBm[c])?[...x].map(c=>SUBm[c]).join(""):"_"+x});
 for(let i=0;i<4;i++)t=t.replace(/\\d?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,(_,a,b)=>w(a)+"/"+w(b)).replace(/\\sqrt\s*\{([^{}]*)\}/g,(_,a)=>"√"+w(a));
 t=t.replace(/\\[,;: ]/g," ").replace(/\\%/g,"%").replace(/\\([A-Za-z]+)/g,(_,c)=>c in MC?MC[c]:c);
 return t.replace(/[{}]/g,"").replace(/ {2,}/g," ")}
const tx=t=>esc(mf(t));
const S={u:null,set:{},subs:[],mats:[],cur:null,mat:null,words:[],view:"home",notes:[],subOpen:false,forms:[],queue:[],cons:[]};
const NC=["var(--card)","#fbbc04","#34a853","#4285f4","#ea4335","#a142f4"];let db,auth;
if(CFG.apiKey==="PASTE"){$("#app").innerHTML="<h2>Потрібне налаштування</h2><p>Заповни файл config.js.</p>"}
else{const a=initializeApp(CFG);auth=getAuth(a);db=getFirestore(a);onAuthStateChanged(auth,async u=>{S.u=u;if(u)await load();render();if(u)procQ()})}
const col=n=>collection(db,"users",S.u.uid,n),dr=(n,i)=>doc(db,"users",S.u.uid,n,i);
const ld=n=>getDocs(col(n)).then(q=>q.docs.map(d=>({id:d.id,...d.data()})));
async function load(){
 const[st,subs,mats,words,notes,forms,cons,queue]=await Promise.all([getDoc(doc(db,"users",S.u.uid)),ld("subjects"),ld("materials"),ld("words"),ld("notes"),ld("formulas"),ld("concepts"),ld("queue")]);
 S.set=st.exists()?st.data():{};theme();S.subs=subs;
 if(!S.subs.length){await Promise.all(DEF.map((n,i)=>addDoc(col("subjects"),{name:n,o:i})));S.subs=await ld("subjects")}
 S.subs.sort((a,b)=>a.o-b.o);S.cur=S.cur||S.subs[0]?.id;
 S.mats=mats.sort((a,b)=>b.t-a.t);S.words=words;S.notes=notes.sort((a,b)=>b.t-a.t);S.forms=forms;S.cons=cons;S.queue=queue;
 if(!S.set.sub2)await mig()}
async function mig(){
 const old=["Elektrotechnik","Fachkunde Elektro","Mathematik","Physik","Deutsch","Arbeitsschutz","Wirtschaft und Sozialkunde","Werkstatt/Praxis"],used=new Set(S.mats.map(m=>m.sub)),have=S.subs.map(s=>s.name);
 await Promise.all([...S.subs.filter(s=>old.includes(s.name)&&!used.has(s.id)).map(s=>deleteDoc(dr("subjects",s.id))),...DEF.filter(n=>!have.includes(n)).map((n,i)=>addDoc(col("subjects"),{name:n,o:10+i}))]);
 await setDoc(doc(db,"users",S.u.uid),{sub2:1},{merge:true});S.set.sub2=1;
 const q=await getDocs(col("subjects"));S.subs=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.o-b.o);S.cur=S.subs[0]?.id}
function theme(){const r=document.documentElement;r.dataset.theme=S.set.theme&&S.set.theme!=="auto"?S.set.theme:"";r.style.setProperty("--ac",S.set.acc||"#3b6ef5")}
function render(){
 const m=$("#app");$("#rail").style.display=S.u?"":"none";document.body.classList.toggle("in",!!S.u);
 if(!S.u){m.innerHTML=`<h2>Berufsschule</h2><p class=mut>Твої матеріали з уроків в одному місці.</p><button class=p data-a=login>Увійти через Google</button>`;return}
 rail();
 const h=`<header><span style="display:flex;align-items:center;gap:8px"><svg width="24" height="24" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" style="fill:var(--ac)"/><polygon points="56,12 24,56 46,56 40,88 76,40 54,40" fill="#fff"/></svg><b>Berufsschule</b></span></header>`;
 m.innerHTML=h+(S.mat?matView():({cons:cView,home:homeView,dict:dictView,notes:notesView,forms:fView,queue:qView}[S.view]||listView)());
 if(!S.mat&&S.view=="dict")dictList();if(!S.mat&&S.view=="forms")fList();if(!S.mat&&S.view=="cons")cList()}
function rail(){
 const ic=p=>`<svg viewBox="0 0 24 24" width=22 height=22 fill=none stroke=currentColor stroke-width=1.8 stroke-linecap=round stroke-linejoin=round><path d="${p}"/></svg>`,
 it=(a,v,p,t,on)=>`<button class="ri${on?" on":""}" data-a=${a} data-v="${v}">${ic(p)}<span>${t}</span></button>`;
 $("#rail").innerHTML=it("nav","home","M4 11l8-7 8 7v9h-5v-6H9v6H4z","Головна",S.view=="home")
 +it("togsub","","M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z","Предмети",S.view=="subj")
 +`<div class="sl${S.subOpen?" on":""}">`+S.subs.map(s=>`<button class="si${s.id==S.cur&&S.view=="subj"?" on":""}" data-a=sub data-v="${s.id}" data-cm="sub:${s.id}">${esc(s.name)}</button>`).join("")+`<button class=si data-a=addsub>+ Новий предмет</button></div>`
 +it("nav","dict","M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11","Словник",S.view=="dict")
 +it("nav","cons","M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z","Поняття",S.view=="cons")
 +it("nav","forms","M17 5H7l5 7-5 7h10","Формули",S.view=="forms")
 +it("nav","notes","M5 3h14v18H5zM9 8h6M9 12h6M9 16h3","Нотатки",S.view=="notes")
 +it("nav","queue","M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z","Черга"+(S.queue.length?" ("+S.queue.length+")":""),S.view=="queue")
 +it("set","","M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M6 15v4","Налаштування")}
function listView(){
 const s=S.subs.find(x=>x.id==S.cur),g={};S.mats.filter(x=>x.sub==S.cur).forEach(x=>(g[x.topic||"Без теми"]??=[]).push(x));
 const b=Object.entries(g).map(([t,a])=>`<h3>${esc(t)}</h3>`+a.map(x=>`<div class=card data-a=open data-v="${x.id}"><span>${esc(x.title)}</span><small>${ago(x.t)}</small></div>`).join("")).join("")||`<p class=mut>Тут поки порожньо. Додай конспект на головній сторінці.</p>`;
 return`<h2>${esc(s?.name||"")}</h2>${b}`}
function fmHtml(m){return(m.fm||[]).length?`<h3 class=sec>Формули</h3>`+m.fm.map(x=>`<div class=fc><code>${tx(x.f)}</code>${x.n?`<small>${tx(x.n)}</small>`:""}<table>${(x.v||[]).map(v=>`<tr><td style="width:60px"><b>${tx(v.s)}</b></td><td>${tx(v.de)}</td><td class=mut>${tx(v.uk)}</td></tr>`).join("")}</table></div>`).join(""):""}
function homeView(){return`<h2 style="font-size:1.7em">Головна</h2><p class=mut>Швидкі дії</p><div class=tiles><button class=tile data-a=new><svg viewBox="0 0 24 24" width=28 height=28 fill=none stroke=currentColor stroke-width=1.8 stroke-linecap=round><path d="M12 5v14M5 12h14"/></svg><b>Додати конспект</b><small>Фото, PDF, Word або презентація</small></button></div>`}
function cView(){return`<h2>Поняття</h2><div class=row><input id=cq placeholder="Пошук" style="flex:1;min-width:160px"><select id=cfs style="width:auto"><option value="">Усі предмети</option>${S.subs.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select><select id=cok style="width:auto"><option value="">Усі поняття</option><option value="1">★ Вивчені</option><option value="0">Не вивчені</option></select></div><div id=cprog></div><div id=cl></div>`}
function cList(){
 const q=($("#cq")?.value||"").toLowerCase(),f=$("#cfs")?.value,m=$("#cok")?.value,k=w=>w.replace(/^(der|die|das)\s/i,"");
 const a=S.cons.filter(x=>(!f||x.sub==f)&&(!m||(m=="1"?x.ok:!x.ok))&&(!q||JSON.stringify(x).toLowerCase().includes(q))).sort((x,y)=>k(x.a).localeCompare(k(y.a),"de"));
 const b=S.cons.filter(x=>!f||x.sub==f),o=b.filter(x=>x.ok).length,pc=b.length?Math.round(o/b.length*100):0;
 $("#cprog").innerHTML=`<div class=pb><i style="width:${pc}%"></i></div><small>Вивчено ${pc}%</small>`;
 $("#cl").innerHTML=a.map(x=>`<div class=card style="display:block;cursor:auto" data-cm="con:${esc(x.id)}"><button class=st data-a=ck data-v="${esc(x.id)}" style="float:right">${x.ok?"★":"☆"}</button><b>${tx(x.a)}</b>${x.tr?` <span class=mut>— ${tx(x.tr)}</span>`:""}<div style="margin-top:4px;line-height:1.6">${tx(x.b)}</div><small>${tx(S.subs.find(s=>s.id==x.sub)?.name||"")}</small></div>`).join("")||"<p class=mut>Понять поки немає. Вони з'являться після нових конспектів.</p>"}
function fView(){return`<h2>Формули</h2><div class=row><input id=fq placeholder="Пошук" style="flex:1;min-width:160px"><select id=ffs style="width:auto"><option value="">Усі предмети</option>${S.subs.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select><select id=fok style="width:auto"><option value="">Усі формули</option><option value="1">★ Вивчені</option><option value="0">Не вивчені</option></select></div><div id=fprog></div><div id=fl></div>`}
function fList(){

async function putQ(base,items){const ref=doc(col("queue")),meta=[],im=[];items.forEach(o=>{if(o.i){meta.push({g:im.length});im.push(o.i)}else meta.push({x:o.x})});
 await Promise.all(im.map((d,n)=>setDoc(doc(qi(ref.id),String(n)),{d})));await setDoc(ref,{...base,items:meta})}
async function qItems(q){const m=q.items||[...(q.txt?[{x:q.txt}]:[]),...(q.imgs||[]).map(i=>({i}))];if(!m.some(o=>o.g!=null))return m;
 const im={};(await getDocs(qi(q.id))).docs.forEach(d=>im[d.id]=d.data().d);return m.map(o=>o.g!=null?{i:im[o.g]}:o).filter(o=>o.i||o.x)}
async function qrm(q){(await getDocs(qi(q.id))).docs.forEach(d=>deleteDoc(d.ref));await deleteDoc(dr("queue",q.id))}
const qt=q=>{try{return q.title||(q.res&&JSON.parse(q.res).t)||q.fname}catch(e){return q.fname}};
const TSYS="Translate the headings (h) and paragraphs (p) of this JSON array into correct, natural Ukrainian. German technical terms may stay only as short terms in brackets, for example: Оглядова схема (Übersichtsschaltplan). Keep the same structure and array length. Reply with the JSON array only.";
const PSYS="You are a strict reviewer. SOURCE units (page images or file texts) are given first, then a DRAFT JSON array of materials made from them; each draft item lists its source unit numbers in \"u\". Check the draft against its source units and fix it: 1) language: all explanatory text (s, the explanations in d, q, h) must be Ukrainian, so translate any German sentences into Ukrainian (German stays only as single terms); spelling, grammar and wrong word forms in the Ukrainian text and the spelling of German words; 2) every statement that is not supported by the source or is technically wrong (electrical engineering, control technology, German terms and their Ukrainian translations): correct it or remove it; 3) task hints and model answers must be correct and consistent with the task; if something cannot be verified from the source (for example an unclear diagram), write 'Не вдалося точно визначити за фото' instead of guessing; 4) rewrite any LaTeX or backslash notation as plain readable Unicode text (· × ÷ / ² ³ √ Ω π, fractions as a / b); 5) keep the same keys and structure. Reply with the corrected JSON array only: same order, same keys (u,s,d,w,f,k).";
async function proof(ms,src){try{const K=["s","d","w","f","k"],L=a=>Array.isArray(a)?a.length:-1,
 x=await ask([...src,{text:"DRAFT:\n"+JSON.stringify(ms.map(r=>({u:r.u,s:r.s,d:r.d,w:r.w,f:r.f,k:r.k})))}],PSYS,true);
 const ok=(a,b)=>{const m=L(a),n=L(b);return n<0||(m>=0&&m>=n*.5&&m<=n*1.2+1)};
 return Array.isArray(x)&&x.length==ms.length&&ms.every((r,i)=>K.every(c=>ok(x[i]?.[c],r[c])))?ms.map((r,i)=>{const c={};K.forEach(f=>{if(x[i][f]!==undefined)c[f]=x[i][f]});return{...r,...c}}):ms}catch(e){return ms}}
let busy=false;
async function procQ(){
 if(busy||!S.u||!S.set.key)return;busy=true;
 try{await lq();
  for(const q of S.queue.filter(x=>!["err","pick"].includes(x.st)&&(x.next||0)<=Date.now()).sort((a,b)=>a.t-b.t)){
   await updateDoc(dr("queue",q.id),{st:"run",next:Date.now()+300000});q.st="run";q.next=Date.now()+300000;rer();
   try{const items=await qItems(q),p=[];
    items.forEach((o,i)=>{if(o.x)p.push({text:"["+(i+1)+"] File text:\n"+o.x});else{p.push({text:"["+(i+1)+"] Page image:"});p.push({inlineData:{mimeType:"image/jpeg",data:o.i.split(",")[1]}})}});
    const r0=await ask(p),arr=(Array.isArray(r0.m)?r0.m:[r0]).filter(x=>x&&typeof x=="object");
    if(!arr.length)throw new Error("Порожня відповідь");
    const ms=await proof(arr,p),U=ms.map(r=>[...new Set((Array.isArray(r.u)?r.u:[]).map(n=>+n-1).filter(n=>items[n]))]);
    if(ms.length==1)U[0]=items.map((_,i)=>i);else{const us=new Set(U.flat());items.forEach((_,i)=>{if(!us.has(i))U[0].push(i)})}
    for(let k=0;k<ms.length;k++){const r=ms[k],its=U[k].map(i=>items[i]),sid=q.sub||matchSub(r.j);
     if(sid)await saveMat({...q,...fromItems(its),sub:sid,topic:q.topic||String(r.th||"").trim().slice(0,60)},r);
     else await putQ({sub:"",topic:"",title:"",fname:q.fname,st:"pick",res:JSON.stringify(r),err:"",tries:0,next:0,t:q.t+k+1},its)}
    await qrm(q)}
   catch(e){const n=(q.tries||0)+1,rt=!e.status||[429,500,503,504].includes(e.status),m=e.status?"Gemini "+e.status+(e.msg?": "+e.msg.slice(0,120):""):e.message;
    await updateDoc(dr("queue",q.id),rt&&n<20?{st:"wait",tries:n,err:m,next:Date.now()+(e.status==429?36e5:3e5)}:{st:"err",err:m})}
   await load();rer()}}
 catch(e){console.error(e)}
 busy=false;rer()}
setInterval(()=>{if(S.u)procQ()},60000);addEventListener("online",()=>S.u&&procQ());
async function ask(parts,sys,rev){const ms=[S.set.model||"gemini-flash-lite-latest"];if(S.set.fb&&S.set.fb!==ms[0])ms.push(S.set.fb);if(rev)ms.reverse();let err;
 for(let i=0;i<3;i++){if(i)await new Promise(r=>setTimeout(r,4000*i));for(const m of ms){try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":S.set.key},body:JSON.stringify({systemInstruction:{parts:[{text:sys||SYS+"\nSubjects: "+S.subs.map(s=>s.name).join("; ")}]},contents:[{parts}],generationConfig:{responseMimeType:"application/json",temperature:.2,maxOutputTokens:30000}})});
  if(!r.ok){err=new Error();err.status=r.status;try{err.msg=(await r.json()).error.message}catch{}if([404,429,503].includes(r.status))continue;throw err}
  const j=await r.json();return JSON.parse(j.candidates[0].content.parts.map(p=>p.text||"").join("").replace(/```json|```/g,""))}catch(e){err=e;if(!e.status)throw e}}
 if(err?.status!=503)break}
 throw err}
async function shrink(src,max=1280){const b=src instanceof Blob?await createImageBitmap(src):src,k=Math.min(1,max/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=b.width*k;c.height=b.height*k;c.getContext("2d").drawImage(b,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.65)}
async function read(files){const items=[];
 for(const f of files){const n=f.name.toLowerCase();
  if(f.type.startsWith("image/"))items.push({i:await shrink(f)});
  else if(n.endsWith(".txt"))items.push({x:await f.text()});
  else if(n.endsWith(".docx"))items.push({x:(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value});
  else if(n.endsWith(".pptx")){const z=await JSZip.loadAsync(await f.arrayBuffer());
   for(const k of Object.keys(z.files).filter(k=>/^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a,b)=>a.match(/\d+/)-b.match(/\d+/)))
    items.push({x:[...(await z.files[k].async("string")).matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m=>m[1]).join(" ")})}
  else if(n.endsWith(".pdf")){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
   const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,pg=[];
   for(let i=1;i<=pdf.numPages;i++)pg.push((await(await pdf.getPage(i)).getTextContent()).items.map(x=>x.str).join(" "));
   if(pg.join("").replace(/\s/g,"").length<60*pdf.numPages){for(let i=1;i<=Math.min(pdf.numPages,12);i++){const p=await pdf.getPage(i),v=p.getViewport({scale:1.5}),c=document.createElement("canvas");c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext("2d"),viewport:v}).promise;items.push({i:await shrink(c)})}}else pg.forEach(x=>items.push({x}))}}
 return items}
</script></body></html>
